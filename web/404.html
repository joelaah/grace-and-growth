<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Grace & Growth - Daily Sanctuary</title>
  <script type="text/javascript">
    // Single Page App redirect for GitHub Pages hosting under /grace-and-growth/
    // Preserves verse deep links, language codes, and mood stages when direct routing triggers a 404
    (function() {
      var location = window.location;
      var pathSegments = location.pathname.split('/').filter(Boolean);
      var repoSegment = pathSegments.length > 0 ? pathSegments[0] : 'grace-and-growth';
      var origin = location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '');
      var redirectUrl = origin + '/' + repoSegment + '/' + (location.search || '') + (location.hash || '');
      location.replace(redirectUrl);
    })();
  </script>
</head>
<body>
</body>
</html>
