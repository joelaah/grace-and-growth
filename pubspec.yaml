name: bible_glory
description: "A humble and contemplative Scripture and mood reflection app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.15.4
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  flutter_tts: ^4.2.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed_verses.json
